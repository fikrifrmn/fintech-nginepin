<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Hotel Fintech</title>
    <meta name="description" content="BlueFlame Stay Admin Dashboard - Manage bookings and analytics">
    
    <!-- Libraries -->
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        * {
            --primary-color: #0F52BA;
            --secondary-color: #3F00FF;
            --accent-color: #89CFF0;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(15, 82, 186, 0.1);
        }
    }

    @layer base {
        body {
            @apply bg-[var(--dark-bg)] text-white;
            font-family: 'Poppins', sans-serif;
        }
    }

    @layer components {
        .card-glow {
            @apply bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--primary-color)] 
                   rounded-2xl p-6 transition-all duration-300;
        }
        
        .card-glow:hover {
            @apply border-[var(--accent-color)];
        }
        
        .stat-card {
            @apply card-glow text-center;
        }
        
        .glow-button {
            @apply bg-gradient-to-r from-[var(--primary-color)] to-[var(--secondary-color)] 
                   px-8 py-3 rounded-full font-semibold 
                   transition-all duration-300 shadow-lg;
        }
        
        .glow-button:hover {
            @apply shadow-[0_0_20px_rgba(15,82,186,0.6)] scale-105;
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="components/AdminAuthCheck.js"></script>
    <script type="text/babel" src="components/AdminSidebar.js"></script>
    <script type="text/babel" src="components/AdminStats.js"></script>
    <script type="text/babel" src="components/AdminChart.js"></script>
    <script type="text/babel" src="components/AdminBookings.js"></script>
    <script type="text/babel" src="components/AdminRooms.js"></script>
    <script type="text/babel" src="admin-app.js"></script>
    
    <!-- Babel Initialization & Debug Script -->
    <script>
        (function() {
            console.log('🔧 Admin page initialization started');
            
            // Check if libraries loaded
            const checkLibraries = setInterval(() => {
                if (window.Babel && window.React && window.ReactDOM) {
                    clearInterval(checkLibraries);
                    console.log('✓ All libraries loaded (React, ReactDOM, Babel)');
                    
                    // Wait for Babel to transform scripts
                    setTimeout(() => {
                        const rootElement = document.getElementById('root');
                        if (rootElement && rootElement.children.length > 0) {
                            console.log('✓ Admin dashboard rendered successfully');
                        } else {
                            console.error('❌ Admin dashboard NOT rendered');
                            console.log('Root element:', rootElement);
                            console.log('Check browser console for React/Babel errors');
                        }
                    }, 1500);
                }
            }, 100);
            
            // Safety timeout
            setTimeout(() => {
                clearInterval(checkLibraries);
                console.log('⚠️ Library check timeout');
            }, 10000);
        })();
    </script>
</body>
</html>
