<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking - BlueFlame Stay</title>
    <meta name="description" content="Book your room at BlueFlame Stay - Pick your vibe">
    
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react@18/umd/react.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://resource.trickle.so/vendor_lib/unpkg/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://resource.trickle.so/vendor_lib/unpkg/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        * {
            --primary-color: #0F52BA;
            --secondary-color: #3F00FF;
            --accent-color: #89CFF0;
            --dark-bg: #0a0e1a;
            --card-bg: rgba(15, 82, 186, 0.1);
        }
    }

    @layer base {
        body {
            @apply bg-[var(--dark-bg)] text-white;
            font-family: 'Poppins', sans-serif;
        }
    }

    @layer components {
        .glow-button {
            @apply bg-gradient-to-r from-[var(--primary-color)] to-[var(--secondary-color)] 
                   px-8 py-3 rounded-full font-semibold 
                   transition-all duration-300 shadow-lg;
        }
        
        .glow-button:hover {
            @apply shadow-[0_0_20px_rgba(15,82,186,0.6)] scale-105;
        }
        
        .input-field {
            @apply w-full px-4 py-3 rounded-xl bg-[var(--card-bg)] border border-[var(--primary-color)] 
                   text-white placeholder-gray-400 focus:outline-none focus:border-[var(--accent-color)] 
                   transition-all duration-300;
        }
        
        .card-glow {
            @apply bg-[var(--card-bg)] backdrop-blur-sm border border-[var(--primary-color)] 
                   rounded-2xl p-6 transition-all duration-300;
        }
        
        .card-glow:hover {
            @apply shadow-[0_0_30px_rgba(15,82,186,0.4)] scale-105 border-[var(--accent-color)];
        }
    }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel" src="components/BookingNavbar.js"></script>
    <script type="text/babel" src="booking-app.js"></script>
</body>
</html>
